    <style>

        h1, h2, h3, .font-heading { font-family: 'Rajdhani', sans-serif; letter-spacing: 0.05em; }
        .grid-cell { transition: all 0.15s ease; }
        .grid-cell:hover { transform: scale(1.08); z-index: 10; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f17; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }

<body class="min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-black">

                </div>
            </div>

                </div>
                <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                    <span class="text-xs text-slate-400 font-medium uppercase tracking-wider mr-2" id="filter-label">Filter:</span>

            </div>

                        <span>5:00</span>
                        <span>10:00</span>
                        <span>15:00</span>
                        <span>20:00</span>
                        <span>25:00</span>
                        <span>30:00</span>
                        <span>35:00</span>
                        <span>40:00+</span>

                        <!-- Populated via JS -->
                    </div>
                </div>
            </div>

                    <!-- Populated via JS -->
                </div>

        function renderHeroes() {
            const gridContainer = document.getElementById('heroes-grid');
            const searchVal = document.getElementById('hero-search').value.toLowerCase();
            gridContainer.innerHTML = '';

            const filtered = heroesData.filter(h => {
                const matchesSearch = h.name.toLowerCase().includes(searchVal);
                if (!matchesSearch) return false;
                if (currentHeroFilter === 'gun') return h.bullet >= 60;
                if (currentHeroFilter === 'spirit') return h.spirit >= 75;
                if (currentHeroFilter === 'hybrid') return h.bullet > 30 && h.bullet < 60;
                return true;
            });

            filtered.forEach(h => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/90 border border-slate-800/90 rounded-2xl p-4 flex flex-col gap-4 shadow-lg";

                const roleColor = h.bullet >= 60 ? 'bg-orange-500/10 text-orange-400 border-orange-500/30' : h.spirit >= 75 ? 'bg-purple-500/10 text-purple-400 border-purple-500/30' : 'bg-blue-500/10 text-blue-400 border-blue-500/30';
                const roleText = h.bullet >= 60 ? 'Gun Carry' : h.spirit >= 75 ? 'Spirit Caster' : 'Hybrid';

                let html = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-slate-800 to-slate-950 border border-slate-700 flex items-center justify-center font-heading font-bold text-amber-400 text-sm shadow">
                                ${h.name.substring(0, 2).toUpperCase()}
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-base tracking-wide font-heading">${h.name}</h3>
                                <span class="text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full border ${roleColor}">${roleText}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-orange-400">${h.bullet}% Bullet</span>
                            <span class="block text-[10px] text-purple-400">${h.spirit}% Spirit</span>
                        </div>
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-[11px] text-slate-400 font-medium">
                            <span>Bullet vs Ability</span>
                            <span>${h.bullet} / ${h.spirit}</span>
                        </div>
                        <div class="h-2.5 w-full bg-slate-950 rounded-full overflow-hidden flex border border-slate-800">
                            <div class="bg-gradient-to-r from-amber-600 to-orange-500 h-full" style="width: ${h.bullet}%"></div>
                            <div class="bg-gradient-to-r from-purple-600 to-indigo-500 h-full" style="width: ${h.spirit}%"></div>
                        </div>
                    </div>

                    <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800/80 space-y-2">
                        <div class="flex justify-between text-[10px] font-bold text-slate-500 uppercase tracking-widest text-center">
                            <span class="w-1/3">Early</span>
                            <span class="w-1/3">Mid</span>
                            <span class="w-1/3">Late</span>
                        </div>
                `;

                ['early', 'mid', 'late'].forEach(phase => {
                    const val = h.grid[phase];
                    const valText = currentLang === 'en' ? i18n.en[val] : i18n.fr[val];
                    const bgCol = val === 'strong' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40' : val === 'medium' ? 'bg-amber-500/20 text-amber-400 border-amber-500/40' : 'bg-rose-500/20 text-rose-400 border-rose-500/40';

                    html += `
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-slate-400 font-medium uppercase text-[10px] w-12">${phase}</span>
                            <div class="flex-1 mx-2">
                                <button onclick="${editMode ? `cycleGrid('${h.id}', '${phase}')` : ''}" class="w-full py-1 rounded-lg font-bold text-[11px] uppercase border ${bgCol} ${editMode ? 'cursor-pointer hover:opacity-80 ring-1 ring-amber-500/50' : 'cursor-default'} transition">
                                    ${valText} ${editMode ? ' ⚙️' : ''}
                                </button>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;

                html += `
                    <div class="space-y-1.5 border-t border-slate-800/80 pt-3">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">${i18n[currentLang].abilitiesTitle}</span>
                        <div class="grid grid-cols-2 gap-1.5">
                `;

                h.abilities.forEach((ab, idx) => {
                    html += `
                        <div class="bg-slate-950 p-2 rounded-lg border border-slate-800/60 text-[11px] space-y-0.5">
                            <div class="flex justify-between items-center font-bold text-white">
                                <span class="truncate">#${idx+1} ${ab.name}</span>
                                <span class="text-[9px] text-amber-400 bg-amber-500/10 px-1 rounded">${ab.cd}</span>
                            </div>
                            <p class="text-slate-400 text-[10px] leading-tight line-clamp-2">${ab.desc}</p>
                        </div>
                    `;
                });

                html += `</div></div>`;
                card.innerHTML = html;
                gridContainer.appendChild(card);
            });
        }

        function cycleGrid(heroId, phase) {
            const hero = heroesData.find(h => h.id === heroId);
            if (!hero) return;
            const states = ['strong', 'medium', 'weak'];
            const currentIdx = states.indexOf(hero.grid[phase]);
            hero.grid[phase] = states[(currentIdx + 1) % states.length];
            renderHeroes();
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-tracks');
            container.innerHTML = '';
            timelineData.forEach(track => {
                const trackDiv = document.createElement('div');
                trackDiv.className = "flex items-center bg-slate-950/60 rounded-xl p-2.5 border border-slate-800/60 relative overflow-hidden";
                let trackHtml = `
                    <div class="w-48 pr-3 border-r border-slate-800 shrink-0">
                        <span class="text-xs font-bold text-white block uppercase font-heading">${track.category}</span>
                        <span class="text-[10px] text-slate-400 block">${track.label}</span>
                    </div>
                    <div class="flex-1 relative h-8 mx-4">
                        <div class="absolute inset-y-1/2 left-0 right-0 h-0.5 bg-slate-800"></div>
                `;
                track.items.forEach(item => {
                    trackHtml += `
                        <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 group cursor-pointer" style="left: ${item.x}%">
                            <div class="w-3.5 h-3.5 rounded-full bg-amber-500 border-2 border-slate-950 shadow"></div>
                            <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block bg-slate-900 border border-slate-700 text-white text-[10px] px-2 py-1 rounded shadow-xl whitespace-nowrap z-30">
                                <span class="font-bold text-amber-400">${item.time}</span> - ${item.label}
                            </div>
                        </div>
                    `;
                });
                trackHtml += `</div>`;
                trackDiv.innerHTML = trackHtml;
                container.appendChild(trackDiv);
            });
        }

        function toggleTimelineFilterAll(show) { renderTimeline(); }

        function renderReference() {
            const grid = document.getElementById('reference-grid');
            grid.innerHTML = '';
            referenceCards.forEach(card => {
                const div = document.createElement('div');
                div.className = "bg-slate-900/90 border border-slate-800 rounded-xl p-4 space-y-2 shadow";
                div.innerHTML = `
                    <span class="text-[10px] font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">${card.cat}</span>
                    <h4 class="font-bold text-white text-sm font-heading">${card.title}</h4>
                    <p class="text-xs text-slate-400 leading-relaxed">${card.desc}</p>
                `;
                grid.appendChild(div);
            });
        }

        function setItemCategory(cat) {
            currentItemCategory = cat;
            document.querySelectorAll('.item-cat-btn').forEach(b => {
                b.className = b.dataset.cat === cat ? "item-cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-black transition" : "item-cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-950 text-slate-300 border border-slate-800 hover:bg-slate-800 transition";
            });
            renderItems();
        }

        function filterItems() { renderItems(); }

        function renderItems() {
            const grid = document.getElementById('items-grid');
            const searchVal = document.getElementById('item-search').value.toLowerCase();
            grid.innerHTML = '';
            const filtered = itemsData.filter(i => (i.name.toLowerCase().includes(searchVal) || i.stats.some(s => s.toLowerCase().includes(searchVal))) && (currentItemCategory === 'all' || i.cat === currentItemCategory));

            filtered.forEach(item => {
                const card = document.createElement('div');
                const catColor = item.cat === 'Weapon' ? 'text-orange-400 bg-orange-500/10 border-orange-500/30' : item.cat === 'Vitality' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30' : 'text-purple-400 bg-purple-500/10 border-purple-500/30';
                card.className = "bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between gap-3 shadow";
                let html = `
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded border ${catColor}">${item.cat} · T${item.tier}</span>
                            <h4 class="font-bold text-white text-base font-heading mt-1">${item.name}</h4>
                        </div>
                        <span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/20 shrink-0">🪙 ${item.cost}</span>
                    </div>
                    <div class="space-y-1 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/60">
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Stats Bonus</span>
                        <ul class="space-y-0.5">
                `;
                item.stats.forEach(st => { html += `<li class="text-xs text-slate-300 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>${st}</li>`; });
                html += `</ul></div>`;
                if (item.passive) html += `<p class="text-xs text-slate-400 italic">💡 <strong class="text-slate-300 not-italic">Passive:</strong> ${item.passive}</p>`;
                if (item.active) html += `<p class="text-xs text-amber-300/90 font-medium">⚡ <strong class="text-amber-400">Active:</strong> ${item.active}</p>`;
                card.innerHTML = html;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
